apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-snapshot
  namespace: portfolio
  labels:
    app.kubernetes.io/name: homelab-snapshot
spec:
  schedule: '7 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: homelab-snapshot
        spec:
          serviceAccountName: homelab-snapshot
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              image: ghcr.io/ar3secchim/api-homelab-public:main
              imagePullPolicy: Always
              env:
                - name: R2_ACCOUNT_ID
                  value: replace-with-account-id
                - name: R2_BUCKET
                  value: replace-with-bucket-name
                - name: R2_OBJECT_KEY
                  value: snapshot.json
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: homelab-snapshot-r2
                      key: R2_ACCESS_KEY_ID
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: homelab-snapshot-r2
                      key: R2_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true

