apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: homelab-snapshot-r2
  namespace: portfolio
  labels:
    app.kubernetes.io/name: homelab-snapshot
spec:
  hostAPI: https://infisical.example.invalid/api
  resyncInterval: 3600
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-credentials
        secretNamespace: portfolio
      secretsScope:
        projectSlug: replace-with-project-slug
        envSlug: replace-with-environment-slug
        secretsPath: /replace-with-secret-path
  managedSecretReference:
    secretName: homelab-snapshot-r2
    secretNamespace: portfolio
    creationPolicy: Owner
